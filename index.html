<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration System</title>
  <link rel="stylesheet" href="style.css">

  <!-- React 18 + Babel standalone via CDN (no build tools) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Components first, App last -->
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="StudentForm.jsx"></script>
  <script type="text/babel" src="StudentList.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>

  <!-- Dev live-reload: polls dev.php and refreshes when a file changes.
       Localhost only. Delete this block (and dev.php) before submitting. -->
  <script>
    (function () {
      var host = location.hostname;
      if (host !== "localhost" && host !== "127.0.0.1") {
        return;
      }

      var current = null;

      var warned = false;

      function check() {
        fetch("dev-temp.php?t=" + Date.now(), { cache: "no-store" })
          .then(function (response) { return response.text(); })
          .then(function (text) {
            var data;
            try {
              data = JSON.parse(text);
            } catch (e) {
              if (!warned) {
                warned = true;
                console.error("[dev] dev-temp.php did not return JSON - live reload is off.");
              }
              return;
            }

            if (!data.version) {
              return;
            }
            if (current === null) {
              current = data.version;
              console.log("[dev] watching for file changes...");
            } else if (current !== data.version) {
              console.log("[dev] change detected - reloading");
              location.reload();
            }
          })
          .catch(function () { /* server restarting - ignore */ });
      }

      check();
      setInterval(check, 1000);
    })();
  </script>
</body>
</html>
